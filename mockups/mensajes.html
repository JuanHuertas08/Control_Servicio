<!doctype html><html><head><meta charset="utf-8"><style>
body{font-family:Segoe UI,Arial,sans-serif;background:#fff;margin:0;padding:16px;color:#1f2937}
.wrap{width:760px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:8px;font-size:14.5px;font-weight:600;border-left:6px solid}
.ok{background:#e9f5dc;color:#1f5f2e;border-color:#1f8240}
.err{background:#fde8e8;color:#9b1c1c;border-color:#c0392b}
.ic{width:24px;height:24px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.ok .ic{background:#1f8240}.err .ic{background:#c0392b}
</style></head><body><div class="wrap">
<div class="msg ok"><span class="ic">✓</span>Información guardada exitosamente.</div>
<div class="msg err"><span class="ic">✕</span>No se pudo almacenar la información. Datos incompletos.</div>
</div></body></html>
